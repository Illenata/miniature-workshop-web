# Local stack: PostgreSQL + RustFS (S3-compatible storage) + API + pages.
#   docker compose up -d --build         everything
#   docker compose up -d postgres storage only the services; API and pages run with `npm run dev`
# Settings come from .env.example, overridden by .env if present.
# Ports are bound to 127.0.0.1 so nothing is exposed to the local network.
# The reverse proxy with TLS (Caddy) is added with the production setup.

name: miniature-workshop

x-env: &env
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mw-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-mw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible storage. MinIO no longer publishes container images (2025),
  # so local development uses RustFS. Production uses whatever S3-compatible service
  # the host provides; the app only speaks plain S3. Override with STORAGE_IMAGE.
  # Pinned by digest: the `latest` build of 2026-10-17 (RustFS publishes few fixed tags).
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b}
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-mw-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-mw-local-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storagedata:/data

  api:
    <<: *env
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-mw}:${POSTGRES_PASSWORD:-mw-local-password}@postgres:5432/${POSTGRES_DB:-mw}
      S3_ENDPOINT: http://storage:9000
    ports:
      - "127.0.0.1:3000:3000"
    # The API itself waits for storage to answer (see src/server.ts).
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started

  web:
    <<: *env
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_INTERNAL_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storagedata:
